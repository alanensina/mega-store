version: "3.9"

services:
  inventory-service-postgres:
    image: postgres:14.2
    container_name: inventory-service-db-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: inventory-service
    ports:
      - "5432:5432"
    networks:
      - inventory-service-postgres-network

networks:
  inventory-service-postgres-network: