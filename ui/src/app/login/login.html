<main class="login-container">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <form class="login-card" [formGroup]="form" (ngSubmit)="login()" novalidate>
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8h12l-1 11a2 2 0 0 1-2 1.8H9A2 2 0 0 1 7 19L6 8Z" />
          <path d="M9 8V7a3 3 0 0 1 6 0v1" />
          <path d="M10 13.5c.6.7 1.2 1 2 1s1.4-.3 2-1" />
        </svg>
      </div>
      <h1>ESN Store</h1>
      <p class="subtitle">Where everything you need is just a click away</p>
    </header>

    <div class="field">
      <input id="username" type="text" formControlName="username" placeholder=" " autocomplete="username" />
      <label for="username">Username</label>
    </div>

    <div class="field">
      <input id="password" type="password" formControlName="password" placeholder=" " autocomplete="current-password" />
      <label for="password">Password</label>
    </div>

    <button type="submit" class="primary">Login</button>

    <div class="divider"><span>or</span></div>

    <button type="button" class="secondary" (click)="newUser()">New user</button>
  </form>
</main>
