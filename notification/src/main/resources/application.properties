spring.application.name=notification
spring.application.version=1.0

server.port=8083

# Actuator
management.endpoints.web.exposure.include=health,info

spring.datasource.url=jdbc:postgresql://localhost:5436/notification-service
spring.datasource.username=${NOTIFICATION_DB_USERNAME}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configure with a Gmail account and an App Password.
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=notification
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic.name=orders_notification
