spring.application.name=order-api
spring.application.version=1.0

server.port=8082

# Local config
# Database config
spring.datasource.url=jdbc:postgresql://localhost:5435/order-service
spring.datasource.username=user
spring.datasource.password=password

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# Swagger configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# Kafka configuration
spring.kafka.producer.bootstrap-servers=localhost:9094
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.orders.topic.name=orders_topic
spring.kafka.orders.notification.topic.name=orders_notification