spring.application.name=order-api
spring.application.version=1.0

server.port=8082

# Actuator
management.endpoints.web.exposure.include=health,info

# Local config
# Database config
spring.datasource.url=jdbc:postgresql://localhost:5435/order-service
spring.datasource.username=${ORDER_DB_USERNAME}
spring.datasource.password=${ORDER_DB_PASSWORD}

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# Swagger configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# JWT settings must match the customer service that issues the tokens.
jwt.secret=${JWT_SECRET}

# Kafka configuration
spring.kafka.producer.bootstrap-servers=localhost:9094
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.JsonSerializer
spring.kafka.orders.topic.name=orders_topic
spring.kafka.orders.notification.topic.name=orders_notification

# Customer API resilience
order.customer.base-url=http://localhost:8081
order.customer.timeout-ms=2000
order.customer.retry.max-attempts=3
order.customer.retry.initial-delay-ms=200
order.customer.retry.max-delay-ms=2000
order.customer.circuit.failure-threshold=4
order.customer.circuit.open-duration-ms=30000
