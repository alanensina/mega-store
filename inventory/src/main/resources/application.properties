spring.application.name=inventory-api
spring.application.version=1.0

server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

# Local config
# Database config
spring.datasource.url=jdbc:postgresql://localhost:5433/inventory-service
spring.datasource.username=${INVENTORY_DB_USERNAME}
spring.datasource.password=${INVENTORY_DB_PASSWORD}

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# Swagger configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# JWT settings must match the customer service that issues the tokens.
jwt.secret=${JWT_SECRET}

# AWS S3 configuration
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=inventory
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic.name=orders_topic
