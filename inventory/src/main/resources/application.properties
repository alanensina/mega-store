spring.application.name=inventory-api
spring.application.version=1.0

server.port=8080

# Local config
# Database config
spring.datasource.url=jdbc:postgresql://localhost:5433/inventory-service
spring.datasource.username=user
spring.datasource.password=password

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# Swagger configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=inventory
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic.name=orders_topic