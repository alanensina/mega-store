spring.application.name=customer-api
spring.application.version=1.0

server.port=8081
server.error.include-message=always

# Actuator
management.endpoints.web.exposure.include=health,info

# Local config
# Database config
spring.datasource.url=jdbc:postgresql://localhost:5434/customer-service
spring.datasource.username=${CUSTOMER_DB_USERNAME}
spring.datasource.password=${CUSTOMER_DB_PASSWORD}

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# Swagger configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# CSRF cookie HttpOnly: true by default for safety; set to false in dev only if the UI needs access
csrf.cookie-http-only=false
